[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
csv = "1.4"
polars = { version = "=0.55.2", default-features = false, features = ["lazy", "parquet", "cloud", "http", "dtype-struct"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10.4"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
